version: "3.8"

services:
  # ===== MySQL Database =====
  mysql:
    image: mysql:8.0
    container_name: vhr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: vhr
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./vhr.sql:/docker-entrypoint-initdb.d/01-vhr.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ===== Redis (Session Cache) =====
  redis:
    image: redis:6-alpine
    container_name: vhr-redis
    restart: unless-stopped
    command: redis-server --requirepass 123 --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== RabbitMQ (Message Queue for Mail) =====
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: vhr-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "15672:15672"
      - "5673:5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ===== Spring Boot Backend =====
  backend:
    build:
      context: ./vhr
      dockerfile: Dockerfile
    container_name: vhr-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # MySQL - match credentials in application.yml
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vhr?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123
      # Redis
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: 123
      # RabbitMQ
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SPRING_RABBITMQ_PUBLISHER_CONFIRMS: "true"
      SPRING_RABBITMQ_PUBLISHER_RETURNS: "true"
      # Flyway (DB already has data from init.sql)
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "1"
      # Timezone
      TZ: Asia/Shanghai
    ports:
      - "8081:8081"

  # ===== Nginx + Frontend =====
  frontend:
    build:
      context: ./vuehr
      dockerfile: Dockerfile
    container_name: vhr-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
